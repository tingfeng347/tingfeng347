name: Generate 3D Contrib

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: yoshi389111/github-profile-3d-contrib@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: tingfeng347
        with:
          outputs: |
            profile-3d-contrib/profile-night-rainbow.svg

      - name: Push to profile-3d-contrib branch
        run: |
          cp -r profile-3d-contrib /tmp/profile-3d-contrib
          git fetch origin profile-3d-contrib || true
          git checkout profile-3d-contrib 2>/dev/null || git checkout --orphan profile-3d-contrib
          cp -r /tmp/profile-3d-contrib/* profile-3d-contrib/ 2>/dev/null || cp -r /tmp/profile-3d-contrib/* ./
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git diff --staged --quiet || git commit -m "Update 3D contrib graph"
          git push origin profile-3d-contrib --force
