name: Terminal Dashboard

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    name: render terminal dashboard
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check dashboard animation regressions
        run: python -m unittest discover -s tests -v

      # PROFILE_TOKEN (a PAT with read:user) counts private contributions too;
      # without it the default token renders public activity only.
      - name: Render dashboard SVGs
        run: python scripts/generate_dashboard.py ${{ github.repository_owner }}
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/terminal-dark.svg assets/terminal-light.svg \
                  assets/terminal-dark-mobile.svg assets/terminal-light-mobile.svg \
                  assets/snake-dark.svg assets/snake-light.svg
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "chore(dashboard): refresh terminal svg"
          git push
