name: Waka Readme

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"

permissions:
  contents: write

concurrency:
  group: waka-readme
  cancel-in-progress: false

jobs:
  update-readme:
    name: Update Readme with Metrics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check metrics publishing regressions
        run: node tests/test_waka_publish.cjs

      - name: Update README with metrics
        id: metrics
        uses: anmol098/waka-readme-stats@master
        env:
          # Generate real metrics as README_CONTENT without the action's git push.
          DEBUG_RUN: "True"
          INPUT_GH_USER: ${{ github.repository_owner }}
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          SHOW_UPDATED_DATE: "True"
          SHOW_PROFILE_VIEWS: "False"
          SHOW_COMMIT: "True"
          SHOW_DAYS_OF_WEEK: "True"
          SHOW_SHORT_INFO: "False"
          SHOW_LINES_OF_CODE: "False"
          SHOW_LOC_CHART: "False"
          SHOW_TOTAL_CODE_TIME: "False"
          SHOW_AI_CODE_TIME: "False"
          SHOW_AI_CODING: "False"
          SHOW_LANGUAGE: "True"
          SHOW_OS: "True"
          SHOW_TIMEZONE: "False"
          SHOW_EDITORS: "True"
          SHOW_PROJECTS: "False"
          SHOW_LANGUAGE_PER_REPO: "False"
          SYMBOL_VERSION: "2"

      # Publish against the current README SHA after metrics collection so
      # dashboard and other concurrent commits are preserved.
      - name: Publish and verify generated metrics
        uses: actions/github-script@v7
        env:
          WAKA_METRICS: ${{ steps.metrics.outputs.README_CONTENT }}
        with:
          script: |
            const section = /^<!--START_SECTION:waka-->[\s\S]*?^<!--END_SECTION:waka-->/m;
            const prefix = 'README stats current output:\n\n';
            const output = process.env.WAKA_METRICS;
            if (!output?.startsWith(prefix)) throw new Error('WakaTime action output is missing');
            const generated = `<!--START_SECTION:waka-->\n${output.slice(prefix.length).trimEnd()}\n<!--END_SECTION:waka-->`;
            const updated = generated.match(/Last Updated on (\d{2})\/(\d{2})\/(\d{4}) (\d{2}):(\d{2}):(\d{2}) UTC/);
            if (!updated || !generated.includes('💬 Programming Languages:')) {
              throw new Error('Generated WakaTime metrics are missing or incomplete');
            }
            const [day, month, year, hour, minute, second] = updated.slice(1).map(Number);
            const age = Date.now() - Date.UTC(year, month - 1, day, hour, minute, second);
            if (age < -60000 || age > 24 * 60 * 60 * 1000) {
              throw new Error('Generated WakaTime metrics are stale');
            }
            const target = { ...context.repo, path: 'README.md' };
            const branch = context.payload.repository.default_branch;
            const read = async () => (await github.rest.repos.getContent({ ...target, ref: branch })).data;
            const decode = file => Buffer.from(file.content, 'base64').toString('utf8');
            for (let attempt = 0; attempt < 3; attempt++) {
              const file = await read();
              const current = decode(file);
              if (!section.test(current)) throw new Error('README WakaTime markers are missing');
              const content = current.replace(section, () => generated);
              if (content === current) break;
              try {
                await github.rest.repos.createOrUpdateFileContents({
                  ...target, branch, sha: file.sha,
                  message: 'Updated with Dev Metrics',
                  content: Buffer.from(content).toString('base64'),
                });
                break;
              } catch (error) {
                if (error.status !== 409 || attempt === 2) throw error;
              }
            }
            if (decode(await read()).match(section)?.[0] !== generated) {
              throw new Error('Published README does not contain the generated metrics');
            }
            core.info('Fresh WakaTime metrics verified on GitHub');
